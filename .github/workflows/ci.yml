name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3
      - run: helm lint deploy/chart
      - run: helm template release deploy/chart | kubectl apply --dry-run=client -f -
        env:
          HELM_EXPERIMENTAL_OCI: "1"
        # kubectl is preinstalled on ubuntu-latest runners.
