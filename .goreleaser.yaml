version: 2

project_name: cert-expiry-exporter

before:
  hooks:
    - go mod tidy

builds:
  - id: exporter
    main: ./cmd/exporter
    binary: exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: exporter
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - DESIGN.md
      - deploy/grafana-dashboard.json

dockers:
  - id: exporter-amd64
    image_templates:
      - "ghcr.io/tigertrust/cert-expiry-exporter:{{ .Version }}-amd64"
      - "ghcr.io/tigertrust/cert-expiry-exporter:latest-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.release
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/tigertrust/cert-expiry-exporter"
  - id: exporter-arm64
    image_templates:
      - "ghcr.io/tigertrust/cert-expiry-exporter:{{ .Version }}-arm64"
      - "ghcr.io/tigertrust/cert-expiry-exporter:latest-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.release
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/tigertrust/cert-expiry-exporter"

docker_manifests:
  - name_template: "ghcr.io/tigertrust/cert-expiry-exporter:{{ .Version }}"
    image_templates:
      - "ghcr.io/tigertrust/cert-expiry-exporter:{{ .Version }}-amd64"
      - "ghcr.io/tigertrust/cert-expiry-exporter:{{ .Version }}-arm64"
  - name_template: "ghcr.io/tigertrust/cert-expiry-exporter:latest"
    image_templates:
      - "ghcr.io/tigertrust/cert-expiry-exporter:latest-amd64"
      - "ghcr.io/tigertrust/cert-expiry-exporter:latest-arm64"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  mode: replace
  extra_files:
    - glob: ./dist/chart/*.tgz
