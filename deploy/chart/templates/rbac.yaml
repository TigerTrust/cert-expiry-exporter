apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-expiry-exporter.fullname" . }}
  labels: {{- include "cert-expiry-exporter.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-expiry-exporter.fullname" . }}
  labels: {{- include "cert-expiry-exporter.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-expiry-exporter.fullname" . }}
  labels: {{- include "cert-expiry-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-expiry-exporter.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-expiry-exporter.fullname" . }}
    namespace: {{ .Release.Namespace }}
