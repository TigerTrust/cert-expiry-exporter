apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-expiry-exporter.fullname" . }}
  labels: {{- include "cert-expiry-exporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
  selector: {{- include "cert-expiry-exporter.selectorLabels" . | nindent 4 }}
