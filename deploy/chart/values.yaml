image:
  repository: ghcr.io/tigertrust/cert-expiry-exporter
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

exporter:
  metricsAddr: ":8080"
  probeAddr: ":8081"
  interval: 60s
  namespaces: ""          # "" = all namespaces
  requireAnnotation: false
  logFormat: text         # text|json

service:
  type: ClusterIP
  port: 8080

serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 20m
    memory: 32Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
